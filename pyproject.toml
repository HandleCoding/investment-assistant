[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-assistant"
version = "0.1.0"
description = "Personal investment research assistant for A-shares, funds, ETFs, and Hong Kong stocks."
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.16.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
